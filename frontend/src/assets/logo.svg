<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <!-- Option 4: Handshake minimalista + wordmark -->
  <defs>
    <linearGradient id="g4" x1="0" x2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- icon: two minimalist hands forming a handshake -->
  <g transform="translate(40,60)">
    <rect x="0" y="0" width="200" height="200" rx="20" fill="none"/>
    <path d="M30 120 C60 90, 120 90, 150 120" stroke="url(#g4)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M30 90 C60 120, 120 120, 150 90" stroke="#64748B" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="50" cy="80" r="6" fill="#06B6D4"/>
    <circle cx="140" cy="130" r="6" fill="#10B981"/>
  </g>
  <!-- wordmark -->
  <g transform="translate(280,140)">
    <text x="0" y="0" font-family="Poppins, sans-serif" font-size="86" font-weight="700" fill="#0F172A">Empresta</text>
    <text x="0" y="86" font-family="Poppins, sans-serif" font-size="86" font-weight="700" fill="#06B6D4">Aí</text>
  </g>
  <text x="280" y="280" font-family="Inter, sans-serif" font-size="18" fill="#475569">Confiança direta entre pessoas</text>
</svg>
